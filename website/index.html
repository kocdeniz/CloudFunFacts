<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Fun Facts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: #fff;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #4a3a8a;
        }

        .subtitle {
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .fact-box {
            background: #f8f7ff;
            border-radius: 12px;
            padding: 1.5rem;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
            transition: opacity 0.3s ease;
        }

        .fact-box.loading {
            opacity: 0.5;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☁️ Cloud Fun Facts</h1>
        <p class="subtitle">Powered by AWS Lambda + Amazon Bedrock</p>
        <div class="fact-box" id="factBox">
            Click the button to get a fun cloud fact!
        </div>
        <button onclick="getFact()">Get a Fun Fact</button>
    </div>

    <script>
        // API Gateway endpoint — Terraform will replace this placeholder
        const API_URL = "{{API_GATEWAY_URL}}";

        async function getFact() {
            const factBox = document.getElementById("factBox");
            factBox.classList.add("loading");
            factBox.textContent = "Fetching a fun fact...";

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                factBox.textContent = data.fact || "No fact received.";
            } catch (error) {
                factBox.textContent = "Something went wrong. Please try again.";
                console.error("Error:", error);
            } finally {
                factBox.classList.remove("loading");
            }
        }
    </script>
</body>
</html>
